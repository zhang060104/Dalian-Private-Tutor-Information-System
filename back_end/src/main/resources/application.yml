server:
  # 8080/8081/8082 被造物集占用，8090 另有服务；本服务固定 8083
  port: 8083

spring:
  application:
    name: dalian-tutor-back
  datasource:
    # 密码一律通过环境变量 DB_PASSWORD 注入，禁止写进本文件/提交仓库
    url: jdbc:mysql://localhost:3306/dalian_tutor?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.daliantutor.entity
  configuration:
    map-underscore-to-camel-case: true

daliantutor:
  # 登录令牌 HMAC 签名密钥（生产环境通过环境变量覆盖）
  token-secret: ${TUTOR_TOKEN_SECRET:dalian-tutor-dev-secret-2026}
  token-ttl-hours: 168
  # 图片上传根目录（收款码/身份证/证书/支付截图/仲裁证据），经 /files/** 对外访问
  upload-dir: ${TUTOR_UPLOAD_DIR:./uploads}
  # 滑块验证码联调开关：true 时跳过 consume 校验（便于纯接口联调，生产务必保持 false）
  captcha-disabled: ${TUTOR_CAPTCHA_DISABLED:false}

logging:
  level:
    com.daliantutor: info
