# nginx.conf —— 大连家教系统 反向代理 + 静态托管
# 用途：80 端口统一入口，静态资源由 nginx 直出，/api 与 /files 反代到后端 8083
# 启动：E:\program\nginx-1.28.0\nginx.exe  （在 conf 目录所在根执行）
# 重载：nginx -s reload   停止：nginx -s quit

worker_processes  2;
worker_rlimit_nofile 8192;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 select;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  logs/access.log  main;
    error_log   logs/error.log   warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 20m;

    # ---- gzip 压缩：显著降低 JS/CSS 传输量 ----
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ---- 后端 upstream：多实例时在此加 server 行即可水平扩展 ----
    upstream tutor_backend {
        server 127.0.0.1:8083;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        # 前端生产构建产物（npm run build 生成）
        root   E:/personalProjects/Dalian-Private-Tutor-Information-System/front_end/dist;
        index  index.html;

        # 静态资源长缓存（文件名带 hash）
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # public 下的图片等
        location /imgs/ {
            expires 7d;
            try_files $uri =404;
        }

        # ---- 业务 API 反代 ----
        location /api/ {
            proxy_pass         http://tutor_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
            proxy_buffering       on;
            proxy_buffer_size     16k;
            proxy_buffers         8 32k;
        }

        # ---- 上传文件静态访问（后端已托管，这里反代到后端）----
        location /files/ {
            proxy_pass         http://tutor_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ---- SPA history 路由回退 ----
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
